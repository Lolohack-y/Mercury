<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="description" content="Наглядность+ — схемы, карточки, презентации и тесты строго по страницам вашего учебника." />
  <title>Наглядность+ — материалы по учебнику</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("nagliadnost-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <link rel="stylesheet" href="/max/styles.css?v=20261031f" />
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержанию</a>

  <div class="app">
    <header class="topbar">
      <button type="button" class="icon-btn back" id="back" aria-label="Назад" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>

      <a class="brand" href="#/home" aria-label="Наглядность+, на главную">
        <span class="brand-mark" aria-hidden="true">Н<span>+</span></span>
        <span class="brand-text">
          <strong>Наглядность<span>+</span></strong>
          <small id="who">строго по учебнику</small>
        </span>
      </a>

      <div class="top-actions">
        <button type="button" class="ai-pill" id="aiPill" data-act="go" data-screen="ai" aria-label="Нейросеть выключена">
          <span class="dot" aria-hidden="true"></span>
          <span class="ai-pill-text">ИИ</span>
        </button>
        <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Включить тёмную тему" aria-pressed="false">
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>

  <div class="dock" id="dock" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="/max/app.js?v=20261031f"></script>
</body>
</html>
